<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portafolio de Aída Alejandra Carvajal, Desarrolladora Full Stack Java Jr." />
  <title>Ale Carvajal | Desarrolladora Full Stack Java</title>
</head>

<body>


  <!-- ========== NAVBAR FIJA ========== -->
  <header>
    <nav class="navbar navbar-expand-lg fixed-top navbar-portafolio" aria-label="Navegación principal">
      <div class="container-fluid">
        <!-- Logo: al hacer clic regresa al inicio -->
        <a class="navbar-brand" href="#inicio">
          <img src="/img/logo-ale-carvajal.png" alt="Ale Carvajal - Inicio" class="logo-navbar" />
        </a>

        <!-- Botón hamburguesa (solo aparece en pantallas chicas) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Enlaces -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto gap-lg-4">
            <li class="nav-item"><a class="nav-link" href="#proyectos">Proyectos</a></li>
            <li class="nav-item"><a class="nav-link" href="#sobre-mi">Sobre Mí</a></li>
            <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
            <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ========== BARRA LATERAL DE SKILLS + CONTENIDO ========== -->
  <div class="d-lg-flex">

    <aside class="sidebar-skills d-none d-lg-flex flex-column align-items-center" aria-label="Skills principales">
      <h2 class="sidebar-titulo">
        <img src="/img/titulo-soft-skills.png" alt="Soft Skills" class="titulo-imagen efecto-neon" />
      </h2>
      <div id="patronus-contenedor" class="patronus-contenedor flex-grow-1 d-flex flex-column justify-content-around">
      </div>
    </aside>

    <!-- ========== CONTENIDO PRINCIPAL ========== -->
    <main class="flex-grow-1">

      <section id="inicio" class="seccion">
        <div class="container-fluid">
          <h1>
            <img src="/img/titulo-nombre.png" alt="Aída Alejandra Carvajal Aguado"
              class="titulo-imagen titulo-imagen--hero efecto-neon" />
          </h1>
        </div>
      </section>

      <section id="proyectos" class="seccion">
        <div class="container-fluid">
          <h2><img src="/img/titulo-proyectos.png" alt="Proyectos" class="titulo-imagen efecto-neon" /></h2>
        </div>
      </section>

      <section id="sobre-mi" class="seccion">
        <div class="container-fuid">
          <h2><img src="/img/titulo-sobre-mi.png" alt="Sobre Mí" class="titulo-imagen efecto-neon" /></h2>
        </div>
      </section>

      <section id="skills" class="seccion">
        <div class="container-fluid">
          <h2><img src="/img/titulo-skills.png" alt="Skills" class="titulo-imagen efecto-neon" /></h2>
        </div>
      </section>

      <section id="contacto" class="seccion">
        <div class="container-fluid">
          <h2><img src="/img/titulo-contacto.png" alt="Contacto" class="titulo-imagen efecto-neon" /></h2>
        </div>
      </section>
    </main>
  </div>


  <script type="module" src="/src/main.js"></script>
</body>

</html>
